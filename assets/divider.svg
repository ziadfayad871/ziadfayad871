<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" width="800" height="50">
  <defs>
    <linearGradient id="ze-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#168BFF">
        <animate attributeName="offset" values="0;0.25;0" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F5B942"/>
      <stop offset="100%" stop-color="#168BFF">
        <animate attributeName="offset" values="1;0.75;1" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <path id="ze-wave"
        d="M10 25 Q 110 2 210 25 T 410 25 T 610 25 T 790 25"
        fill="none" stroke="url(#ze-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <circle r="4" fill="#FFD36A">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#ze-wave"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
